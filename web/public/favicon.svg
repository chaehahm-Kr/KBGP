<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <style>
    .frame { stroke: #111111; }
    .symbol { fill: #111111; }
    @media (prefers-color-scheme: dark) {
      .frame { stroke: #ffffff; }
      .symbol { fill: #ffffff; }
    }
  </style>
  <!-- 사각형 프레임 -->
  <path class="frame" d="M 122 162 H 38 V 38 H 162 V 122" stroke-width="16" stroke-linecap="square" stroke-linejoin="miter" fill="none" />
  
  <!-- 중앙의 K 자 -->
  <path class="symbol" d="M 72 60 H 90 V 98 L 125 60 H 144 L 106 102 L 145 140 H 126 L 90 106 V 140 H 72 Z" />
  
  <!-- 우하단 체크 마크 -->
  <path d="M 116 150 L 138 172 L 174 122" stroke="#8a93a6" stroke-width="16" stroke-linecap="square" stroke-linejoin="miter" fill="none" />
</svg>
