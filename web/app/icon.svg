<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <style>
    .frame { stroke: #111111; }
    .symbol { fill: #111111; }
    @media (prefers-color-scheme: dark) {
      .frame { stroke: #ffffff; }
      .symbol { fill: #ffffff; }
    }
  </style>
  <!-- 사각형 프레임 -->
  <path class="frame" d="M 112 170 H 30 V 30 H 170 V 112" stroke-width="16" stroke-linecap="butt" stroke-linejoin="miter" fill="none" />
  
  <!-- 중앙의 K 자 -->
  <path class="symbol" d="M 70 55 H 88 V 95 L 123 55 H 142 L 103 98 L 143 145 H 124 L 88 103 V 145 H 70 Z" />
  
  <!-- 우하단 체크 마크 -->
  <path d="M 120 148 L 142 170 L 170 120" stroke="#8a93a6" stroke-width="16" stroke-linecap="butt" stroke-linejoin="miter" fill="none" />
</svg>
